name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - name: Smoke import dist
        run: node --input-type=module -e "import p from './dist/index.js'; if (!p?.rules?.['no-server-import-in-client'] || !p?.rules?.['require-use-client'] || !p?.configs?.recommended) { console.error('smoke failed', p); process.exit(1); } console.log('smoke ok', Object.keys(p.rules));"
